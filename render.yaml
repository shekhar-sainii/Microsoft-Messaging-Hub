services:
  - type: web
    name: microsoft-messaging-hub-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false # User will paste their MongoDB Atlas string
      - key: REDIS_URL
        sync: false # User will paste their Upstash Redis string
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_CLIENT_STATE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
